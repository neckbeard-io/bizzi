# bizzi on Linux (topology.md §2.2). Copy .env.example to .env, then:
#   docker compose up -d --build                    # hub + node
#   docker compose --profile containers up -d       # + dind sidecar for container workspaces
# First run (pairing the browser, then the node): see README.md.
# On agent-only machines drop the `hub` service and set BIZZI_HUB_URL=wss://<your hub>/ws/node.

name: bizzi

services:
  hub:
    image: bizzi/hub:${BIZZI_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
      additional_contexts:
        bizzi-node: service:node            # build on the node image built below
      args:
        BIZZI_NODE_IMAGE: bizzi-node
    restart: unless-stopped
    command: ["node", "apps/cli/src/main.ts", "hub", "serve", "--host", "0.0.0.0", "--port", "7777", "--data-dir", "/data"]
    environment:
      BIZZI_PUBLIC_URL: ${BIZZI_PUBLIC_URL:-https://bizzi.example.com}
      BIZZI_NTFY_URL: ${BIZZI_NTFY_URL:-}       # optional push: https://ntfy.sh/<your-secret-topic>
      BIZZI_NTFY_TOKEN: ${BIZZI_NTFY_TOKEN:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - hub-data:/data                      # hub.db (devices, tokens, event-log replica), setup-code
    networks: [proxy, internal]             # SWAG/Caddy reaches it on `proxy`; no published ports
    # ports: ["7777:7777"]                  # only for a first try without a reverse proxy

  node:
    image: bizzi/node:${BIZZI_TAG:-latest}  # or your own `FROM bizzi/node` + toolchains
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    restart: unless-stopped
    init: true                              # reap agent and PTY child processes
    stop_grace_period: 2m                   # drain: finish running turns before restart
    command:
      - node
      - apps/cli/src/main.ts
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "7777"
      - --data-dir
      - /data
      - --name
      - ${BIZZI_MACHINE_NAME:-server-a}
      - --connect
      - ${BIZZI_HUB_URL:-ws://hub:7777/ws/node}   # agent-only machines: wss://bizzi.example.com/ws/node
    environment:
      BIZZI_TOKEN: ${BIZZI_TOKEN:-}             # optional: direct access to the node's own /ws (random if empty)
      BIZZI_PAIR_CODE: ${BIZZI_PAIR_CODE:-}     # one-time node code; used only while /data has no hub credential
      PUID: ${PUID:-1000}                   # run as your host user, so bind-mounted files stay yours
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      # Container workspaces (topology.md §7): with `--profile containers` set BIZZI_DOCKER_HOST=tcp://dind:2376
      # in .env. Only the node's docker CLI uses these; agents never see a Docker daemon.
      BIZZI_DOCKER_HOST: ${BIZZI_DOCKER_HOST:-}
      BIZZI_DOCKER_TLS_VERIFY: "1"
      BIZZI_DOCKER_CERT_PATH: /certs/client
      BIZZI_CONTAINER_IMAGE: ${BIZZI_CONTAINER_IMAGE:-}   # default bizzi/workspace:latest, built on first use
      # Agent logins inside container workspaces: the node forwards CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY,
      # OPENAI_API_KEY and CODEX_API_KEY when set here, or per agent via the secrets store (README).
    volumes:
      - node-data:/data                     # node sqlite (event log = outbox), hub-credential.json
      - node-home:/home/bizzi               # ADE installs + logins (~/.claude, ~/.codex, ...)
      - ${BIZZI_WORKSPACES:-/srv/bizzi/workspaces}:/workspaces   # visible and editable on the host
      - dind-certs:/certs:ro                # dind's TLS client certs (empty without the profile)
    shm_size: 1gb                           # headless browsers
    networks: [internal]

  # Container workspaces (topology.md §7): the node gets its own Docker daemon, never the host socket.
  dind:
    image: docker:dind
    profiles: [containers]
    restart: unless-stopped
    privileged: true                        # dind needs it; scoped to this sidecar, not the node
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - dind-certs:/certs
      - dind-data:/var/lib/docker           # images and containers of container workspaces
      # Same path as in the node: a workspace is bind-mounted into its container by its /workspaces/… path.
      - ${BIZZI_WORKSPACES:-/srv/bizzi/workspaces}:/workspaces
    networks: [internal]

volumes:
  hub-data: {}
  node-data: {}
  node-home: {}
  dind-certs: {}
  dind-data: {}

networks:
  proxy:
    external: true                          # the reverse proxy's network (e.g. SWAG's)
    name: ${BIZZI_PROXY_NETWORK:-proxy}
  internal: {}
