# electron-builder config for the bizzi desktop app. Unsigned for now.
#   npm run pack -w @bizzi/desktop     # unpacked app for this platform (release/<platform>-unpacked)
#   npm run dist:mac|dist:linux|dist:win
# The core is NOT inside app.asar: scripts/stage.ts stages it (sources + deps) and a Node >= 26
# runtime as extraResources, and the main process runs it as a separate process.
appId: dev.bizzi.desktop
productName: bizzi
# Plain file names: the default uses the package name (@bizzi/desktop), and its slash breaks the
# .deb output path. scripts/release/build-desktop.ts renames outputs for the release anyway.
artifactName: bizzi-${version}-${arch}.${ext}
copyright: bizzi contributors
directories:
  output: release
  buildResources: build-resources
files:
  - out/**
  - assets/*.png
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
extraMetadata:
  main: out/main.cjs
extraResources:
  - from: staging/ui
    to: ui
  # electron-builder skips node_modules directories inside an extraResources tree, so the core's
  # production dependencies are their own entry.
  - from: staging/core
    to: core
  - from: staging/core/node_modules
    to: core/node_modules
  - from: staging/node
    to: node
protocols:
  - name: bizzi
    schemes: [bizzi]

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null # unsigned; signing + notarization later (stable identity matters for privacy grants)
  hardenedRuntime: false

linux:
  category: Development
  # Defaults to the package name (@bizzi/desktop), which isn't a valid file name. The .deb
  # installs /opt/bizzi/bizzi, which the updater recognizes (src/update/install.ts).
  executableName: bizzi
  maintainer: bizzi contributors <noreply@bizzi.invalid>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
