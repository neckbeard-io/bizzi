<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- bizzi app icon: a bee in flight on an indigo tile. Source for icon.png / icon.icns / icon.ico (scripts/icons.ts). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="bodyClip"><ellipse cx="0" cy="0" rx="150" ry="205"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <!-- honeycomb, faint -->
  <g fill="none" stroke="#a5b4fc" stroke-opacity="0.14" stroke-width="10">
    <path d="M760 190 l70 40 v80 l-70 40 l-70 -40 v-80 z"/>
    <path d="M830 310 l70 40 v80 l-70 40 l-70 -40 v-80 z"/>
    <path d="M690 310 l70 40 v80 l-70 40 l-70 -40 v-80 z"/>
  </g>
  <!-- flight trail -->
  <path d="M200 790 C 270 690, 330 750, 390 680" fill="none" stroke="#fde047" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 38"/>
  <g transform="translate(535 565) rotate(28) scale(0.8)" filter="url(#shadow)">
    <!-- wings -->
    <ellipse cx="-125" cy="-150" rx="105" ry="150" transform="rotate(-28 -125 -150)" fill="url(#wing)"/>
    <ellipse cx="125" cy="-150" rx="105" ry="150" transform="rotate(28 125 -150)" fill="url(#wing)"/>
    <!-- stinger -->
    <path d="M-26 196 L0 262 L26 196 Z" fill="#1c1917"/>
    <!-- body with stripes -->
    <g clip-path="url(#bodyClip)">
      <ellipse cx="0" cy="0" rx="150" ry="205" fill="url(#body)"/>
      <rect x="-200" y="-40" width="400" height="58" fill="#1c1917"/>
      <rect x="-200" y="70" width="400" height="58" fill="#1c1917"/>
      <rect x="-200" y="175" width="400" height="60" fill="#1c1917"/>
    </g>
    <!-- head -->
    <circle cx="0" cy="-200" r="84" fill="#1c1917"/>
    <circle cx="-34" cy="-220" r="20" fill="#ffffff"/>
    <circle cx="34" cy="-220" r="20" fill="#ffffff"/>
    <circle cx="-30" cy="-216" r="9" fill="#1c1917"/>
    <circle cx="38" cy="-216" r="9" fill="#1c1917"/>
    <!-- antennae -->
    <path d="M-36 -285 C -60 -345, -95 -360, -120 -365" fill="none" stroke="#1c1917" stroke-width="16" stroke-linecap="round"/>
    <path d="M36 -285 C 60 -345, 95 -360, 120 -365" fill="none" stroke="#1c1917" stroke-width="16" stroke-linecap="round"/>
    <circle cx="-122" cy="-366" r="20" fill="#1c1917"/>
    <circle cx="122" cy="-366" r="20" fill="#1c1917"/>
  </g>
</svg>
