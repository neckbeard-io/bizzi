name: CI

# Every pull request, and pushes to main. Pushes to dev don't run it: work reaches dev through a PR,
# and release.yml builds what lands there.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Offline-only tests: live agent tests stay skipped (they need BIZZI_LIVE=1 plus real logins).
  BIZZI_LIVE: '0'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # --strict-allow-scripts: a new dependency with install scripts that isn't listed in
      # package.json "allowScripts" fails CI instead of being skipped with a warning.
      - run: npm ci --strict-allow-scripts

      - run: npm run typecheck

      # docs/protocol.schema.json must match packages/protocol (regenerate with `npm run schema`).
      - run: npm run schema:check

      # No test spawns Electron or needs a display (desktop tests use a stub core over node:test),
      # so Linux runs without xvfb. The UI package's test also does a `vite build`.
      - run: npm test

      - run: npm run build:ui

      # Offline end-to-end: a real hub and node (fake adapters) over the wire, a few seconds each.
      - run: npm run smoke:hub
      - run: npm run smoke:v12

  docker:
    name: docker (node image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build deploy/Dockerfile.node (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.node
          push: false
          tags: bizzi/node:ci
          cache-from: type=gha,scope=node-image
          cache-to: type=gha,scope=node-image,mode=max
